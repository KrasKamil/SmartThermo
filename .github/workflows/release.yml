name: Release & Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub Release & Build Container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartThermo
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalacja zależności i test kompilacji
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Przygotowanie paczki produkcyjnej (Artifact)
        run: |
          mkdir release-dist
          cp -r dist release-dist/
          cp -r public release-dist/
          cp package.json release-dist/
          tar -czf smartthermo-${{ github.ref_name }}.tar.gz -C release-dist .

      - name: Utwórz GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SmartThermo/smartthermo-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Logowanie do GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Przygotowanie tagów Dockera
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Konfiguracja Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Zbuduj i wyślij obraz do rejestru GHCR
        uses: docker/build-push-action@v5
        with:
          context: SmartThermo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
