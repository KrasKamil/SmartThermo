name: SmartThermo CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint:
    name: 1. Linter (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartThermo
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacja zależności
        run: npm install --legacy-peer-deps

      - name: Sprawdzenie lintera
        run: npm run lint

  typecheck-and-build:
    name: 2. TypeScript Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartThermo
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacja zależności
        run: npm install --legacy-peer-deps

      - name: Kompilacja TypeScript (tsc)
        run: npm run build

  unit-tests:
    name: 3. Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartThermo
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacja zależności
        run: npm install --legacy-peer-deps

      - name: Testy jednostkowe
        run: npm test

  docker-dryrun:
    name: 4. Docker Build Dry-Run
    runs-on: ubuntu-latest
    needs: [lint, typecheck-and-build, unit-tests]
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Testowe budowanie kontenera (bez wypychania)
        uses: docker/build-push-action@v5
        with:
          context: SmartThermo
          push: false
          tags: smartthermo:ci-test
