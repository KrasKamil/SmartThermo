name: SmartThermo CI

on:
  push:
    branches: [ "main", "dev", "Player_fix" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint:
    name: 1. Linter (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartThermo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: SmartThermo/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  typecheck-and-build:
    name: 2. TypeScript Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartThermo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: SmartThermo/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  unit-tests:
    name: 3. Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartThermo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: SmartThermo/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test

  docker-dryrun:
    name: 4. Docker Build Dry-Run
    runs-on: ubuntu-latest
    needs: [lint, typecheck-and-build, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: SmartThermo
          push: false
          tags: smartthermo:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
