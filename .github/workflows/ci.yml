name: SmartThermo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartThermo

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: SmartThermo/package.json

      - name: Instalacja zależności
        run: npm ci --legacy-peer-deps

      - name: Sprawdzenie lintera (ESLint)
        run: npm run lint

      - name: Weryfikacja TypeScript i kompilacja (tsc)
        run: npm run build

      - name: Testy jednostkowe (Vitest)
        run: npm test

  docker-dryrun:
    name: Dockerfile Dry-Run Build
    runs-on: ubuntu-latest
    needs: validate-and-test
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Testowe budowanie kontenera (bez wypychania)
        uses: docker/build-push-action@v7
        with:
          context: SmartThermo
          push: false
          tags: smartthermo:ci-test
