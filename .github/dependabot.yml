version: 2
updates:
  # 1. Automatyczne aktualizacje dla zależności npm (Node.js / TypeScript)
  - package-ecosystem: "npm"
    directory: "/SmartThermo"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      all-npm-dependencies:
        patterns:
          - "*"

  # 2. Automatyczne aktualizacje dla zależności Pythona (scripts / media monitor)
  - package-ecosystem: "pip"
    directory: "/SmartThermo"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-py)"
    groups:
      all-python-dependencies:
        patterns:
          - "*"

  # 3. Aktualizacje wersji GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(actions)"
