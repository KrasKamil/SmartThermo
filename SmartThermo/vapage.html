<!DOCTYPE HTML>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Thermo Assistant</title>
    <link rel="stylesheet" href="style-css/style.css">
    <link rel="stylesheet" href="style-css/light.css">
</head>

<body onload="initClock();">

    <div class="container"></div>

    <div id="spotify-overlay">
        <div id="spotify-popup">
            <button class="close-btn" onclick="closeSpotifyPopup()">×</button>
            <div id="spotify-widget" class="spotify-widget glass-effect" style="position: static; box-shadow: none; background: none;">
                <div id="login-view">
                    <p>Połącz z muzyką</p>
                    <a href="/login" class="spotify-btn">Zaloguj do Spotify 🎵</a>
                </div>
                <div id="player-view" style="display: none;">
                    <div class="track-info">
                        <img id="current-art" src="" alt="Okładka" class="album-art" />
                        <div class="text-info">
                            <h3 id="current-track">Nie odtwarzam</h3>
                            <p id="current-artist">Brak aktywności</p>
                        </div>
                    </div>
                    <div class="controls">
                        <button id="prev-btn" class="ctrl-btn">⏮</button>
                        <button id="play-btn" class="ctrl-btn play">⏯</button>
                        <button id="next-btn" class="ctrl-btn">⏭</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="voice-overlay" class="hidden">
        <div class="voice-box glass-effect">
            <div class="pulse-ring"></div>
            <div id="voice-status">Słucham...</div>
            <button class="close-btn" onclick="toggleVoicePopup(true)">×</button>
        </div>
    </div>

    <div id="kontener">

        <button id="theme-button" onclick="toggleTheme()">
            <img src="style-css/icon.svg" alt="Zmień motyw">
        </button>

        <button id="spotify-button" onclick="openSpotifyPopup()">
            <img src="style-css/spotify.png" alt="Uruchom Spotify">
        </button>

        <button id="voiceBtn">
            🎙️
        </button>

        <div id="naglowek">
            <h1>Smart Thermostat</h1>
        </div>

        <div class="kolumna">
            <button id="updateBtn" onclick="ClearData();">🔄 Update Data</button>

            <div id="weather-container" class="weather-card glass-effect">
                <table id="weather-table" class="styled-table">
                    <tr>
                        <td>City</td>
                        <td id="City">-</td>
                    </tr>
                    <tr>
                        <td>Temp Inside</td>
                        <td id="Temp_ins">-</td>
                    </tr>
                    <tr>
                        <td>Humidity</td>
                        <td id="Hum_ins">-</td>
                    </tr>
                    <tr>
                        <td>Pressure</td>
                        <td id="Pressure">-</td>
                    </tr>
                    <tr>
                        <td>Temp Outside</td>
                        <td id="Temp_out">-</td>
                    </tr>
                    <tr>
                        <td>Wind</td>
                        <td id="Wind">-</td>
                    </tr>
                    <tr>
                        <td>Last update</td>
                        <td id="Last_update">-</td>
                    </tr>
                </table>

                <div id="error-message" class="hidden">
                    <h3>⚠️ Błąd</h3>
                    <p id="error-text">Brak połączenia.</p>
                </div>
            </div>
        </div>

        <div class="kolumna">
            <p id='main'></p>
            <div class="datetime">
                <div class="date">
                    <span id="dayname">Day</span>,
                    <span id="month">Month</span>
                    <span id="daynum">00</span>,
                    <span id="year">Year</span>
                </div>
                <div class="time">
                    <span id='hour'>00</span>:
                    <span id='minute'>00</span>:
                    <span id='second'>00</span>
                    <span id='period'>AM</span>
                </div>
            </div>

            <div id="stopka">
                <div id="result"></div>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
